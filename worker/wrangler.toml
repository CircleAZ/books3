name = "azbooks-api-gateway"
main = "src/index.js"
compatibility_date = "2024-12-01"

# The Worker will be deployed to Cloudflare's global edge network.
# Route it to api.circleaz.in/* in the Cloudflare dashboard.
#
# Deployment:
#   1. Install Wrangler: npm install -g wrangler
#   2. Login: wrangler login
#   3. Deploy: wrangler deploy
#
# Add a route in Cloudflare Dashboard:
#   Workers Routes → Add Route
#   Route: api.circleaz.in/*
#   Worker: azbooks-api-gateway

[observability]
enabled = true
