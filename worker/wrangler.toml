name = "azbooks3-api-gateway"
main = "src/index.js"
compatibility_date = "2024-12-01"

# The Worker will be deployed to Cloudflare's global edge network.
# Route it to api3.circleaz.in/* in the Cloudflare dashboard.
#
# Deployment:
#   1. Install Wrangler: npm install -g wrangler
#   2. Login: wrangler login
#   3. Deploy: wrangler deploy
#
# Add a route in Cloudflare Dashboard:
#   Workers Routes → Add Route
#   Route: api3.circleaz.in/*
#   Worker: azbooks3-api-gateway

[observability]
enabled = true

# Cron Trigger — pings all Render backends every 5 minutes
# to prevent free-tier spin-down (15-min idle timeout).
# This ensures token refresh requests always find a warm backend.
[triggers]
crons = ["*/5 * * * *"]
