# Render Infrastructure-as-Code
# Deploy AZBooks3 backend on Render
# https://docs.render.com/infrastructure-as-code
#
# Usage: Connect your Render account to the CircleAZ/books3 GitHub repo.
# Render auto-detects this file and uses it for configuration.

services:
  - type: web
    name: azbooks3
    runtime: docker
    repo: https://github.com/CircleAZ/books3.git
    branch: main
    plan: free
    healthCheckPath: /api/health/
    envVars:
      # ── Core Django ──
      - key: SECRET_KEY
        sync: false  # MUST be set manually and stay stable — generateValue rotates on every deploy, killing all JWT tokens
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com,.circleaz.in,localhost"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://books3.circleaz.in,https://circleaz.in,https://api3.circleaz.in"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://books3.circleaz.in,https://circleaz.in"

      # ── Database (Neon Singapore — pooled connection) ──
      - key: DATABASE_URL
        sync: false  # Set manually: ep-raspy-lake-b39hlekz-pooler.c-4.ap-southeast-1.aws.neon.tech

      # ── Cloudflare R2 ──
      - key: R2_ENDPOINT_URL
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_RECEIPTS_BUCKET
        value: "azbooks3-receipts"

      # ── WhatsApp (optional — pending SIM) ──
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false

      # ── Receipt URL ──
      - key: RECEIPT_BASE_URL
        value: "https://books3.circleaz.in"
