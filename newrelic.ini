[newrelic]
# License key from environment variable (V.O.R.T.E.X. mandate — never hardcode)
license_key = %(NEW_RELIC_LICENSE_KEY)s

# Application name in New Relic dashboard
app_name = %(NEW_RELIC_APP_NAME)s

# EU datacenter (license key starts with eu01)
host = collector.eu01.nr-data.net

# Logging
log_level = info
log_file = stderr

# Transaction tracer — obfuscate SQL (V.O.R.T.E.X. mandate #2)
transaction_tracer.enabled = true
transaction_tracer.record_sql = obfuscated
transaction_tracer.explain_enabled = true
transaction_tracer.explain_threshold = 0.5

# Error collector
error_collector.enabled = true

# Browser monitoring (disabled — React SPA handles its own)
browser_monitoring.auto_instrument = false

# Strip sensitive request parameters
attributes.exclude = request.parameters.password request.parameters.token request.parameters.secret_key

# Distributed tracing
distributed_tracing.enabled = true
