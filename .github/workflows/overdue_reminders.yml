name: Daily Overdue Payment Reminders

on:
  schedule:
    # 9:00 AM IST = 3:30 AM UTC
    - cron: '30 3 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  send-reminders:
    runs-on: ubuntu-latest
    
    env:
      # Database — dynamically built from the backup action's granular secrets
      DATABASE_URL: postgres://${{ secrets.DB_USER }}:${{ secrets.DB_PASSWORD }}@${{ secrets.DB_HOST }}/${{ secrets.DB_NAME }}?sslmode=require
      SECRET_KEY: ${{ secrets.SECRET_KEY || 'django-dummy-key-for-github-actions-to-bypass-check' }}
      DEBUG: 'False'
      # WhatsApp Cloud API
      WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
      WHATSAPP_ACCESS_TOKEN: ${{ secrets.WHATSAPP_ACCESS_TOKEN }}
      # Cloudflare R2
      R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      RECEIPT_BASE_URL: ${{ secrets.RECEIPT_BASE_URL }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: 'pip'
      
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libcairo2-dev gdal-bin libgdal-dev
      
      - name: Install dependencies
        run: pip install -r requirements.txt
      
      - name: Run overdue reminders
        run: python manage.py send_overdue_reminders
