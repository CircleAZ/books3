<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="https://media.circleaz.in/media/store/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#111322" />
    <meta name="description" content="AZ Books Management System" />
    <!-- PWA: Apple touch icon from R2 CDN (generated from store logo) -->
    <link rel="apple-touch-icon" href="https://media.circleaz.in/media/store/apple-touch-icon.png" />
    <!-- iOS standalone mode -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>AZ Books</title>
    <!-- ISSUE #8: Synchronous trap for beforeinstallprompt.
         Must live here (not in main.jsx) because Vite loads modules async.
         Chrome fires the event during HTML parse, before React hydrates. -->
    <script>
      window.deferredInstallPrompt = null;
      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        window.deferredInstallPrompt = e;
        window.dispatchEvent(new Event('app-install-prompt-ready'));
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
